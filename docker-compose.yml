# Zero-configuration deployment.
#
#   docker compose up -d
#
# No .env file is required: the easyshell-secrets one-shot container generates the database
# password, JWT secret, encryption key and agent registration secret on first boot and keeps
# them in the "easyshell_secrets" volume. Anything you do set in .env wins over the
# generated values.
services:
  # One-shot: creates the secrets volume content before anything else starts.
  easyshell-secrets:
    image: ${EASYSHELL_SERVER_IMAGE:-laolupaojiao/easyshell-server:latest}
    container_name: easyshell-secrets
    entrypoint: ["/opt/easyshell/scripts/init-secrets.sh"]
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      AGENT_REGISTER_SECRET: ${AGENT_REGISTER_SECRET:-}
    volumes:
      - easyshell_secrets:/secrets
    restart: "no"

  easyshell-mysql:
    image: mysql:8.0
    container_name: easyshell-mysql
    environment:
      # Read from the generated secrets volume; see scripts/init-secrets.sh
      MYSQL_ROOT_PASSWORD_FILE: /secrets/db_password
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easyshell}
    ports:
      # Loopback only: the database needs no network exposure.
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - easyshell_secrets:/secrets:ro
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      easyshell-secrets:
        condition: service_completed_successfully
    restart: unless-stopped

  easyshell-redis:
    image: redis:7-alpine
    container_name: easyshell-redis
    ports:
      # Loopback only: Redis runs without authentication.
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  easyshell-server:
    image: ${EASYSHELL_SERVER_IMAGE:-laolupaojiao/easyshell-server:latest}
    container_name: easyshell-server
    ports:
      - "${SERVER_PORT:-18080}:18080"
    environment:
      MYSQL_HOST: easyshell-mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-easyshell}
      MYSQL_USER: root
      # MYSQL_PASSWORD / JWT_SECRET / ENCRYPTION_KEY / AGENT_REGISTER_SECRET are filled in
      # by the entrypoint from the generated secrets volume when not set explicitly here.
      REDIS_HOST: easyshell-redis
      REDIS_PORT: 6379
      EASYSHELL_ADMIN_PASSWORD: ${EASYSHELL_ADMIN_PASSWORD:-}
      PROVISION_SERVER_URL: ${PROVISION_SERVER_URL:-http://easyshell-server:18080}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
    volumes:
      - easyshell_secrets:/secrets:ro
    depends_on:
      easyshell-mysql:
        condition: service_healthy
      easyshell-redis:
        condition: service_healthy
    restart: unless-stopped

  easyshell-web:
    image: ${EASYSHELL_WEB_IMAGE:-laolupaojiao/easyshell-web:latest}
    container_name: easyshell-web
    ports:
      - "${WEB_PORT:-18880}:80"
    depends_on:
      easyshell-server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  easyshell_secrets:
  mysql_data:
  redis_data:

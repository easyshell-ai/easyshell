version: 2

# Dependabot policy (2026-11 workflow redesign):
# - One grouped PR per ecosystem per month, so dependency noise cannot bury feature work.
# - Major versions are ignored on purpose: they need a deliberate migration (Spring Boot 4,
#   TypeScript 7, Gradle 9, Node 26). Security updates are still delivered by GitHub's
#   security advisory channel and are not governed by this file.
updates:
  - package-ecosystem: "gradle"
    directory: "/easyshell-server"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      server-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "gomod"
    directory: "/easyshell-agent"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      agent-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/easyshell-web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/easyshell-mcp"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      mcp-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

server:
  port: ${SERVER_PORT:18080}
  servlet:
    context-path: /

spring:
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 510MB
  mvc:
    async:
      request-timeout: -1
  application:
    name: easyshell-server

  datasource:
    # Secrets have no fallback defaults: the container must provide them (see docker-compose.build.yml).
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:easyshell}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        # Hibernate 的 create/drop/migrate 排除 workflow* 和指定的 Flyway JDBC 表；
        # 其他仅由 JDBC 使用的 Flyway 表目前没有 Hibernate 实体映射。
        hbm2ddl:
          schema_filter_provider: com.easyshell.server.config.WorkflowSchemaFilterProvider
    show-sql: false

  # Flyway 纳管工作流、主机身份/ACL、目标快照及其他独立表；
  # 存量实体仍由上面的 ddl-auto 管理，迁移脚本不 ALTER 或 DROP 存量表。
  flyway:
    enabled: true
    # 非空库没有 flyway_schema_history 时先 baseline，再运行更高版本的迁移；
    # 此处未指定 baseline-version，Flyway 默认值为 1，可被外部配置覆盖。
    # 工作流运行、审批及审计数据须永久保留；回退须另行设计，不以删表代替。
    baseline-on-migrate: true
    # 启动即校验：已 applied 的迁移脚本被改动/校验和不一致直接 fail-fast
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0

  ai:
    chat:
      client:
        enabled: false    # 禁用 ChatClient 自动配置，由 ChatModelFactory 管理
    openai:
      api-key: "placeholder"  # 占位，实际使用 DB 中的加密配置
    anthropic:
      api-key: "placeholder"
    ollama:
      base-url: "http://localhost:11434"

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# Interactive API documentation is a development-only affordance: it hands an attacker a
# complete map of every endpoint. Disabled by default (see application-dev.yml).
springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.easyshell: ${LOG_LEVEL:info}
    org.springframework.web: info
    org.hibernate.SQL: info

easyshell:
  version: ${EASYSHELL_VERSION:1.2.0}
  auth:
    # No defaults on purpose - see SecretValidator.
    jwt-secret: ${JWT_SECRET}
    jwt-expire: ${JWT_EXPIRE:86400000}
    refresh-expire: ${REFRESH_EXPIRE:604800000}
    agent-token-expire: ${AGENT_TOKEN_EXPIRE:2592000000}
  security:
    encryption-key: ${ENCRYPTION_KEY}
  agent:
    # Shared secret a brand new agent must present to obtain its first token.
    register-secret: ${AGENT_REGISTER_SECRET:}
    # Only trust X-Forwarded-* when the server really sits behind a trusted proxy.
    trust-proxy-headers: ${AGENT_TRUST_PROXY_HEADERS:false}
  websocket:
    # Comma separated list of browser origins allowed to open WebSockets. Empty = same-origin only.
    allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:}
  workflow:
    # 启动时把五个工作流实体与 Flyway DDL 逐字段比对，不一致即 fail-fast（不建议关闭）
    schema-check:
      enabled: ${WORKFLOW_SCHEMA_CHECK_ENABLED:true}
  provision:
    server-url: ${PROVISION_SERVER_URL:http://127.0.0.1:18080}
    agent-binary-dir: ${AGENT_BINARY_DIR:/opt/easyshell/agent-binaries}

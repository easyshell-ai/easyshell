server:
  port: 8080

spring:
  application:
    name: easyshell-server-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 存量表仍由 Hibernate create-drop 管理；workflow* 五张新表由 Flyway 建，
      # 两者管辖范围由 WorkflowSchemaFilterProvider 强制不相交（与生产同一条对冲）
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          schema_filter_provider: com.easyshell.server.config.WorkflowSchemaFilterProvider

  # 测试库同样跑真实迁移脚本：@DataJpaTest 切片包含 FlywayAutoConfiguration，
  # H2(MODE=MySQL) 上执行 V1_2_0__workflow_engine.sql，与生产同一份 DDL
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  ai:
    chat:
      client:
        enabled: false
    openai:
      api-key: "test-placeholder"
    anthropic:
      api-key: "test-placeholder"
    ollama:
      base-url: "http://localhost:11434"

easyshell:
  auth:
    jwt-secret: easyshell-jwt-secret-key-for-development-only-change-in-production-must-be-at-least-64-chars-long
    jwt-expire: 86400000
    refresh-expire: 604800000
  security:
    encryption-key: easyshell-aes256-encryption-key!!
  provision:
    server-url: http://localhost:8080
    agent-binary-dir: /tmp/easyshell-agent

logging:
  level:
    com.easyshell: warn

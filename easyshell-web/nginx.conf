resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # File upload size limit (for file manager)
    client_max_body_size 500M;

    # Do not advertise the nginx version
    server_tokens off;

    set $backend http://easyshell-server:18080;

    # ---- Security response headers (applied to every response, including errors) ----
    # connect-src must allow ws:/wss: - the web terminal connects to /ws/terminal/*
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # File transfer endpoints — no timeout, no buffering
    location ~ ^/api/v1/.*/files {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 500M;
    }

    # Regular API endpoints
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        # Basic flood protection for the whole API surface (esp. /api/v1/auth/login)
        limit_req zone=api burst=30 nodelay;
        limit_conn api_conn 40;
    }

    location /ws/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Interactive API documentation (/v3/api-docs, /swagger-ui) is intentionally NOT proxied:
    # it is a complete, unauthenticated map of every endpoint. It stays available on the
    # server port for local development only (springdoc is disabled by default).
    # /actuator is not proxied either: only the health probe is public, and that is used
    # from inside the container network.
}

# Rate limiting shared state (declared at http level so it applies to /api/)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
